 const {data:{user}}=await sb.auth.getUser(); if(!user)return;

 profile=data;lang=data.current_language||'en';level=data.current_level||'A1';
}

 rec.map((x,i)=>'<div class="lesson-row"><div class="lesson-icon">'+['📚','🎯','🌎'][i]+'</div><div class="lesson-info"><b>'+x+'</b><small><span class="pill">'+['Vocabulary','Grammar','Communication'][i]+'</span> · 15 min</small></div><button class="arrow" onclick="go(\'practice\')">→</button></div>').join('')+
 '</section><section class="panel"><h2>Skill balance</h2><p>Your learning profile</p><div class="skills">'+[['Reading',78],['Listening',64],['Speaking',52],['Writing',70],['Grammar',66]].map(x=>'<div class="skill-line"><b>'+x[0]+'</b><div class="bar"><i style="width:'+x[1]+'%"></i></div><span>'+x[1]+'%</span></div>').join('')+'</div><div class="quick"><button onclick="go(\'speaking\')">🎙️<b>Speaking</b></button><button onclick="go(\'writing\')">✍️<b>Writing</b></button></div></section></div>'+
 '<div class="dashboard-grid"><section class="panel"><h2>Explore your level</h2><p>Four learning blocks inside every level.</p><div class="roadmap" style="grid-template-columns:repeat(4,1fr);margin-top:14px">'+topics[level].map((x,i)=>'<div class="road '+(i===0?'active':'')+'" style="min-height:110px"><span>0'+(i+1)+'</span><h3>'+x+'</h3><p>Vocabulary · Grammar · Skills</p></div>').join('')+'</div></section><section class="panel"><h2>AI Learning</h2><p>Ferramentas inteligentes integradas à plataforma.</p><div class="quick"><button onclick="go(\'writing\')">✍️<b>AI Writing</b></button><button onclick="go(\'practice\')">⚡<b>AI Practice</b></button></div></section></div></div>';
}
async function courses(){
 return '<div class="wrap"><div class="section-head"><div><div class="eyebrow">MY COURSES</div><h1 class="title">'+(lang==='en'?'English':'Spanish')+' Academy</h1><p class="sub">Escolha um nível e avance por uma trilha estruturada.</p></div></div><div class="course-grid">'+levels.map((l,i)=>'<article class="course-card"><div class="course-top"><span class="level-badge">CEFR '+l+'</span><span style="font-size:10px;color:#aaa">'+(i+1)+'/7</span></div><h2>'+l+' '+(lang==='en'?'English':'Español')+'</h2><p>'+topics[l].join(' · ')+'</p><div class="course-progress"><i style="width:'+(l===level?Math.min(85,20+(profile?.xp||0)/10):15)+'%"></i></div><div class="course-foot"><small>4 units · 24 labs</small><button class="purple" onclick="setLevel(\''+l+'\');go(\'roadmap\')">'+(l===level?'Continue':'Open')+' →</button></div></article>').join('')+'</div></div>';
}
function roadmap(){
 return '<div class="wrap"><div class="section-head"><div><div class="eyebrow">LEARNING PATH</div><h1 class="title">'+level+' Roadmap</h1><p class="sub">Uma sequência clara para sair do conteúdo básico até o uso real da língua.</p></div><button class="purple" onclick="go(\'practice\')">Start practice →</button></div>'+levelsUI()+'<div class="roadmap" style="grid-template-columns:repeat(2,1fr);margin-top:15px">'+topics[level].map((x,i)=>'<article class="road '+(i===0?'active':'')+'"><span>UNIT '+String(i+1).padStart(2,'0')+'</span><h3>'+x+'</h3><p>Vocabulary Lab · Grammar Lab · Reading Lab · Listening Lab · Speaking Lab · Writing Lab</p><button class="soft" style="margin-top:8px;padding:8px 10px" onclick="go(\'practice\')">Open unit →</button></article>').join('')+'</div></div>';
}
async function practice(){
 let r=await sb.from('exercises').select('id,exercise_type,title,lessons(title,skill)').eq('published',true).limit(50);
 let ex=r.data?.[0];
 if(!ex)return '<div class="wrap"><div class="eyebrow">PRACTICE LAB</div><h1 class="title">Practice '+level+'</h1><div class="empty" style="margin-top:18px">Nenhum exercício disponível neste filtro ainda.<br><br><button class="purple" onclick="go(\'writing\')">Try AI Writing</button></div></div>';
 let ir=await sb.from('exercise_items').select('*').eq('exercise_id',ex.id).order('position').limit(1);let it=ir.data?.[0];
 if(!it)return '<div class="wrap"><div class="empty">Exercise without items.</div></div>';
 let opts=Array.isArray(it.options)?it.options:(typeof it.options==='string'?JSON.parse(it.options||'[]'):[]);
 let ans=typeof it.answer==='string'?(()=>{try{return JSON.parse(it.answer)}catch{return it.answer}})():it.answer;
 let correct=ans?.index??ans?.correct??ans??'';
 return '<div class="wrap"><div class="section-head"><div><div class="eyebrow">PRACTICE LAB · '+esc(ex.exercise_type)+'</div><h1 class="title">'+esc(ex.lessons?.title||'Practice')+'</h1><p class="sub">Responda, receba feedback e ganhe XP.</p></div></div><div class="exercise-layout"><section class="exercise-card"><div class="eyebrow">QUESTION 01</div><div class="question">'+esc(it.prompt)+'</div><div class="options">'+opts.map((o,i)=>'<button class="option" onclick="answer(\''+ex.id+'\','+i+',\''+String(correct).replaceAll("'","\\'")+'\')"><b>'+String.fromCharCode(65+i)+'</b>'+esc(o)+'</button>').join('')+'</div><div id="feedback"></div></section><aside class="side-card"><h3>SESSION</h3><div class="progress-list"><div class="progress-item"><span>Level</span><b>'+level+'</b></div><div class="progress-item"><span>Skill</span><b>'+esc(ex.lessons?.skill||'Mixed')+'</b></div><div class="progress-item"><span>XP</span><b>+20</b></div></div><hr style="border:0;border-top:1px solid #eee;margin:15px 0"><button class="soft" style="width:100%" onclick="go(\'skills\')">Change skill</button></aside></div></div>';
}
async function answer(exId,i,correct){let ok=String(i)===String(correct);if($('feedback'))$('feedback').innerHTML='<div class="notice '+(ok?'ok':'error')+'">'+(ok?'Correct! You earned +20 XP.':'Not quite. Review the answer and try again.')+'</div>';if(ok){profile.xp=(profile.xp||0)+20;const {data:{user}}=await sb.auth.getUser();await sb.from('attempts').insert({user_id:user.id,exercise_id:exId,score_percent:100,correct_count:1,total_count:1,answers:{selected:i},xp_earned:20});await sb.from('user_profiles').update({xp:profile.xp}).eq('user_id',user.id)}}
function skills(){return '<div class="wrap"><div class="eyebrow">SKILLS LAB</div><h1 class="title">Train every skill</h1><p class="sub">Pratique cada habilidade de forma independente ou combine todas em uma aula.</p><div class="lab-grid" style="margin-top:18px">'+[['Reading','📖','Textos graduados, compreensão e vocabulário em contexto.'],['Listening','🎧','Áudios, TTS, vídeos e compreensão auditiva.'],['Speaking','🎙️','Respostas gravadas, pronúncia e comunicação.'],['Writing','✍️','Produção escrita com feedback e correções.'],['Grammar','◆','Estruturas gramaticais com prática contextualizada.'],['Vocabulary','Aa','Palavras, expressões, collocations e revisão.']].map(x=>'<article class="lab"><div class="lab-icon">'+x[1]+'</div><h3>'+x[0]+'</h3><p>'+x[2]+'</p><button class="soft" onclick="go(\''+x[0].toLowerCase()+'\')">Open lab →</button></article>').join('')+'</div></div>'}
function library(){return '<div class="wrap"><div class="eyebrow">MEDIA LIBRARY</div><h1 class="title">Real-world content</h1><p class="sub">Uma biblioteca para conectar o estudo ao inglês e espanhol do mundo real.</p><div class="media-grid" style="margin-top:18px">'+[['YouTube Listening','▶','Vídeos incorporados e atividades de compreensão.'],['Audio Lab','🎧','TTS, diálogos e materiais de listening.'],['Reading Library','▣','Textos por nível, tema e habilidade.'],['Vocabulary Bank','Aa','Palavras e expressões por unidade.'],['Grammar Reference','◆','Referência gramatical de A0 a C2.'],['Downloads','↓','PDFs, worksheets e materiais complementares.']].map(x=>'<article class="media-card"><div class="media-thumb">'+x[1]+'</div><div><b>'+x[0]+'</b><small>'+x[2]+'</small><button class="soft" style="margin-top:12px;padding:8px 10px">Explore →</button></div></article>').join('')+'</div></div>'}
function writing(){return '<div class="wrap"><div class="eyebrow">AI WRITING LAB</div><h1 class="title">Write. Get feedback. Improve.</h1><p class="sub">Produza um texto no nível '+level+' e receba uma avaliação estruturada.</p><div class="writing-grid" style="margin-top:18px"><aside class="prompt"><div class="eyebrow">YOUR TASK</div><h3>Share an experience</h3><p>Write about a memorable experience, a trip, a challenge you overcame, or a future plan. Give details, explain why it was important and use connectors.</p><span class="pill">CEFR '+level+'</span><span class="pill">120–150 words</span></aside><section class="panel"><form id="writingForm" class="form"><textarea id="writingText" class="input textarea" placeholder="Start writing here..." required></textarea><button class="purple">Evaluate my writing →</button></form><div id="writingResult"></div></section></div></div>'}
function localEval(t){let w=t.split(/\s+/).filter(Boolean).length,s=Math.round(Math.min(100,Math.max(35,45+Math.min(w,130)*.35+(/[.!?]/.test(t)?8:0)+(t.length>280?10:0))));return{score:s,grammar:Math.min(100,s+2),vocabulary:Math.max(0,s-3),coherence:s,feedback:w<80?'Add more details, examples and connectors to develop your ideas.':'Good development. Review verb tenses and use more precise vocabulary to make the text stronger.'}}
async function evaluateWriting(e){e.preventDefault();let t=$('writingText').value.trim();$('writingResult').innerHTML='<div class="notice">Evaluating...</div>';let r=await sb.functions.invoke('fluent-ai',{body:{text:t,level,language:lang}});let x=r.error||!r.data?localEval(t):r.data;$('writingResult').innerHTML='<div class="notice ok"><b>Score: '+x.score+'/100</b><br>Grammar: '+(x.grammar??x.score)+' · Vocabulary: '+(x.vocabulary??x.vocab??x.score)+' · Coherence: '+(x.coherence??x.score)+'<br><br>'+esc(x.feedback||'Good work.')+(x.corrections?.length?'<br><br><b>Corrections</b><br>'+x.corrections.map(esc).join('<br>'):'')+'</div>';profile.xp=(profile.xp||0)+10;await sb.from('user_profiles').update({xp:profile.xp}).eq('user_id',profile.user_id)}
function speaking(){return '<div class="wrap"><div class="eyebrow">SPEAKING LAB</div><h1 class="title">Find your voice.</h1><p class="sub">Grave sua resposta e construa confiança falando na língua que está aprendendo.</p><div class="record-box" style="margin-top:18px"><div class="eyebrow">PROMPT · '+level+'</div><h2>Tell me about something you enjoy doing.</h2><p class="sub">Speak for 30–60 seconds. Give reasons, examples and details.</p><div class="mic">🎙️</div><button id="recordBtn" class="purple" onclick="toggleRecord()">Start recording</button><span id="recordState" style="margin-left:9px;color:#888;font-size:10px"></span><audio id="audio" controls class="hidden" style="display:block;margin:18px auto 0;width:min(500px,100%)"></audio><div id="speechResult"></div></div></div>'}
async function toggleRecord(){if(!recording){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let b=new Blob(chunks,{type:'audio/webm'});$('audio').src=URL.createObjectURL(b);$('audio').classList.remove('hidden');$('speechResult').innerHTML='<div class="notice ok">Gravação concluída. O próximo estágio pode enviar o áudio para transcrição e avaliação por IA.</div>';profile.xp=(profile.xp||0)+10;sb.from('user_profiles').update({xp:profile.xp}).eq('user_id',profile.user_id);stream.getTracks().forEach(t=>t.stop())};recorder.start();recording=true;$('recordBtn').textContent='Stop recording';$('recordState').textContent='Recording...'}catch(e){$('speechResult').innerHTML='<div class="notice error">Permita o uso do microfone no navegador.</div>'}}else{recorder.stop();recording=false;$('recordBtn').textContent='Start recording';$('recordState').textContent=''}}
async function progress(){let r=await sb.from('attempts').select('score_percent,xp_earned,created_at').order('created_at',{ascending:false}).limit(20);return '<div class="wrap"><div class="eyebrow">MY PROGRESS</div><h1 class="title">Your learning data</h1><p class="sub">Acompanhe prática, XP e desempenho.</p>'+stats()+'<section class="panel" style="margin-top:14px"><div class="panel-head"><div><h2>Skill performance</h2><p>Current learning profile</p></div></div><div class="skills" style="margin-top:18px">'+[['Reading',78],['Listening',64],['Speaking',52],['Writing',70],['Grammar',66],['Vocabulary',74]].map(x=>'<div class="skill-line"><b>'+x[0]+'</b><div class="bar"><i style="width:'+x[1]+'%"></i></div><span>'+x[1]+'%</span></div>').join('')+'</div></section><section class="panel" style="margin-top:14px"><h2>Recent attempts</h2><p>Últimas atividades registradas.</p><table class="history" style="margin-top:10px"><thead><tr><th>DATE</th><th>SCORE</th><th>XP</th></tr></thead><tbody>'+((r.data||[]).map(a=>'<tr><td>'+new Date(a.created_at).toLocaleDateString('pt-BR')+'</td><td>'+a.score_percent+'%</td><td>+'+(a.xp_earned||0)+'</td></tr>').join('')||'<tr><td colspan="3">No attempts yet.</td></tr>')+'</tbody></table></section></div>'}
async function render(){nav();let out=page==='dashboard'?dashboard():page==='courses'?await courses():page==='roadmap'?roadmap():page==='practice'?await practice():page==='skills'?skills():page==='library'?library():page==='writing'?writing():page==='speaking'?speaking():await progress();$('view').innerHTML=out;if(page==='writing')$('writingForm').onsubmit=evaluateWriting}
boot();
</script>
</body>
</html>
