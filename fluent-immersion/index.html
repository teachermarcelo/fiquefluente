<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLUENT IMMERSION</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#17151d;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}main{min-height:100vh;display:flex}aside{width:250px;background:#fff;border-right:1px solid #e9e6ef;padding:24px 16px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 25px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;display:grid;place-items:center;font-weight:800}.brand b{display:block;font-size:18px}.brand small{letter-spacing:3px;color:#888;font-size:8px}.langs{background:#f5f4f8;padding:4px;border-radius:9px;display:flex;margin:0 4px 20px}.langs button{flex:1;background:transparent;padding:8px;border-radius:7px;font-size:11px;color:#777}.langs .on{background:#fff;color:#17151d;box-shadow:0 1px 5px #ddd;font-weight:bold}nav{display:grid;gap:4px}nav button{background:transparent;text-align:left;padding:12px;border-radius:10px;color:#777;font-size:12px}nav .sel{background:#f0ebff;color:#6326c9;font-weight:bold}.side{position:absolute;bottom:24px;left:18px;right:18px;background:#19151f;color:#fff;padding:16px;border-radius:15px;font-size:11px}.side small{color:#aaa;display:block;margin-top:5px}.prog{height:5px;background:#39343f;border-radius:4px;margin-top:10px}.prog i{display:block;height:100%;width:70%;background:#a78bfa;border-radius:4px}.content{margin-left:250px;width:calc(100% - 250px)}header{height:70px;background:#fff;border-bottom:1px solid #e9e6ef;display:flex;align-items:center;padding:0 35px;gap:20px}.crumb{font-size:12px;font-weight:bold}.search{margin-left:auto;background:#f6f5f8;padding:9px 12px;border-radius:9px;width:240px}.search input{border:0;background:transparent;outline:0;width:100%;font-size:11px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ede9fe;color:#6d28d9;font-size:10px;font-weight:bold}.hero{max-width:1160px;margin:28px auto 15px;padding:45px 50px;border-radius:24px;background:linear-gradient(120deg,#f1edff,#fbfaff,#eee8ff);display:flex}.eyebrow{font-size:9px;letter-spacing:2px;color:#8b7e9c;font-weight:bold}.hero h1,.page h1,.practice h1{font-size:40px;line-height:1.05;margin:10px 0;font-family:Arial,sans-serif;letter-spacing:-1px}.hero h1 em{color:#6d28d9;font-style:normal}.hero p{max-width:510px;color:#716b79;font-size:13px;line-height:1.6}.actions{display:flex;gap:9px;margin-top:22px}.primary,.ghost{padding:12px 16px;border-radius:9px;font-size:11px;font-weight:bold}.primary{background:#19151f;color:#fff}.ghost{background:#fff;color:#333}.art{margin-left:auto;width:320px;position:relative}.orb{position:absolute;width:210px;height:210px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#c4b5fd);top:5px;right:35px}.float{position:absolute;background:#fff;padding:8px 10px;border-radius:9px;box-shadow:0 8px 20px #6d28d922;font-size:10px;font-weight:bold}.f1{right:145px;top:10px}.f2{right:0;top:90px}.f3{right:160px;bottom:5px}.f4{right:15px;bottom:45px}.level,.stats,.grid,.page,.practice{max-width:1160px;margin-left:auto;margin-right:auto}.level{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e9e6ef;padding:9px;border-radius:13px}.level strong{margin-right:12px}.level button{width:45px;height:35px;border-radius:8px;background:#f5f4f8;color:#777;font-size:11px;font-weight:bold}.level .active{background:#eee8ff;color:#6326c9}.cefr{margin-left:auto;color:#999;font-size:9px;text-align:right}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.stats>div{background:#fff;border:1px solid #e9e6ef;border-radius:13px;padding:15px}.stats b{font-size:18px}.stats span{display:block;color:#999;font-size:9px;margin-top:3px}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:16px;margin-top:15px}.panel{background:#fff;border:1px solid #e9e6ef;border-radius:15px;padding:19px}.panel h2{font-size:15px;margin:0 0 3px}.panel p{font-size:10px;color:#999;margin:0 0 10px}.panelhead{display:flex;justify-content:space-between}.panelhead button{background:transparent;color:#7040db;font-size:10px}.lesson{display:flex;align-items:center;border-top:1px solid #f0eef3;padding:13px 4px}.num{color:#bbb;font-size:10px;width:28px}.lessonmain{flex:1}.lessonmain b{font-size:12px}.lessonmain small{display:block;color:#999;margin-top:4px}.tag{background:#f0ebff;color:#6d28d9;border-radius:4px;padding:3px 5px}.play{background:#f0ebff;color:#6d28d9;border-radius:50%;width:32px;height:32px}.skill{width:100%;background:#fff;display:grid;grid-template-columns:1fr 80px 28px;gap:8px;align-items:center;text-align:left;border-top:1px solid #f0eef3;padding:12px 0}.skill b,.skill small{font-size:10px}.bar{height:5px;background:#eeeef2;border-radius:4px}.bar i{display:block;height:100%;background:#8b5cf6;border-radius:4px}.page,.practice{padding-top:40px}.lead{font-size:13px;color:#777}.cards,.media{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px}.card,.mediaitem{background:#fff;border:1px solid #e9e6ef;border-radius:15px;padding:22px}.card p{color:#777;font-size:11px;line-height:1.6}.media{grid-template-columns:repeat(3,1fr)}.thumb{height:140px;border-radius:10px;display:grid;place-items:center;color:white;font-size:32px;background:linear-gradient(135deg,#39206e,#9b7bff);margin:-7px -7px 12px}.mediaitem b,.mediaitem small{display:block}.mediaitem b{font-size:12px}.mediaitem small{color:#999;font-size:9px;margin-top:5px}.practicehead{display:flex;justify-content:space-between;align-items:end}.timer{background:#fff;border:1px solid #e9e6ef;padding:11px;border-radius:9px;font-weight:bold}.practicegrid{display:grid;grid-template-columns:1.5fr .65fr;gap:16px;margin-top:25px}.exercise{background:#fff;border:1px solid #e9e6ef;border-radius:16px;padding:25px}.exercise h2{font-size:22px;margin:22px 0}.audio{background:#f7f5fb;padding:12px;border-radius:10px;font-size:11px}.options{display:grid;gap:8px;margin-top:18px}.options button{text-align:left;background:#fff;border:1px solid #e6e2ed;padding:12px;border-radius:9px;font-size:11px}.options button:hover{border-color:#8b5cf6;background:#faf8ff}.hint{margin-top:16px;background:#fff8e8;padding:10px;border-radius:8px;font-size:10px;color:#856a2d}.video{height:180px;border-radius:16px;background:linear-gradient(135deg,#20152c,#7040db);color:white;padding:20px;display:flex;flex-direction:column;justify-content:end}.xp{margin-top:12px;background:white;border:1px solid #e9e6ef;border-radius:14px;padding:17px;font-size:11px}.success{margin-top:15px;background:#eafaf2;color:#187a4b;padding:14px;border-radius:9px;font-size:11px}.hamb{display:none}@media(max-width:900px){aside{display:none}.content{margin:0;width:100%}.hamb{display:block}.hero,.level,.stats,.grid,.page,.practice{margin-left:15px;margin-right:15px}.art{display:none}.stats{grid-template-columns:1fr 1fr}.grid,.practicegrid,.cards,.media{grid-template-columns:1fr}.search{display:none}.hero{padding:30px}.level{overflow:auto}.cefr{display:none}}
</style></head><body><main><aside><div class="brand"><div class="logo">FI</div><div><b>FLUENT</b><small>IMMERSION</small></div></div><div class="langs"><button id="en" class="on">English</button><button id="es">Español</button></div><nav><button class="sel" data-page="dashboard">▦ &nbsp; Dashboard</button><button data-page="practice">◎ &nbsp; Practice</button><button data-page="skills">◈ &nbsp; Skills</button><button data-page="library">▣ &nbsp; Library</button><button data-page="progress">◒ &nbsp; Progress</button></nav><div class="side"><small>TODAY'S GOAL</small><b>20 min practice</b><div class="prog"><i></i></div><small>14 / 20 min</small></div></aside><section class="content"><header><button class="hamb">☰</button><div class="crumb">English › <span id="crumbLevel">B1</span></div><div class="search"><input placeholder="Search lessons, topics..."></div><div class="avatar">TM</div></header><div id="app"></div></section></main><script>
const levels=['A0','A1','A2','B1','B2','C1','C2'];let lang='English',level='B1',page='dashboard',q=0;
const lessons={A0:['Greetings & Introductions','Alphabet & Spelling','Numbers & Personal Info'],A1:['Daily Routines','At the Café','My Family'],A2:['Travel Experiences','Shopping & Prices','Past Events'],B1:['Work & Career','Technology & Society','Travel Stories'],B2:['News & Current Issues','Debates & Opinions','Academic Listening'],C1:['Advanced Arguments','Presentations','Formal Writing'],C2:['Nuance & Register','Advanced Listening Lab','Persuasive Writing']};
function dashboard(){return `<section class="hero"><div><div class="eyebrow">YOUR LANGUAGE JOURNEY</div><h1>Learn. Practice.<br><em>Become fluent.</em></h1><p>Pratique inglês e espanhol de A0 a C2 com atividades que desenvolvem reading, listening, speaking e writing.</p><div class="actions"><button class="primary" onclick="go('practice')">Continue learning →</button><button class="ghost" onclick="go('skills')">Explore skills</button></div></div><div class="art"><div class="orb"></div><div class="float f1">🎧 Listening</div><div class="float f2">🎙️ Speaking</div><div class="float f3">✍️ Writing</div><div class="float f4">📖 Reading</div></div></section><div class="level"><div><span class="eyebrow">CURRENT LEVEL</span><br><strong>${level}</strong></div>${levels.map(x=>`<button class="${x===level?'active':''}" onclick="setLevel('${x}')">${x}</button>`).join('')}<div class="cefr">CEFR<br>A0 → C2</div></div><div class="stats"><div><b>🔥 7</b><span>day streak</span></div><div><b>68%</b><span>course progress</span></div><div><b>142 min</b><span>this week</span></div><div><b>✓ 24</b><span>lessons completed</span></div></div><div class="grid"><div class="panel"><div class="panelhead"><div><h2>Continue practicing</h2><p>Recommended for ${level}</p></div><button onclick="go('practice')">View all →</button></div>${lessons[level].map((x,i)=>`<div class="lesson"><div class="num">0${i+1}</div><div class="lessonmain"><b>${x}</b><small><span class="tag">${['Reading','Speaking','Listening'][i]}</span> · ${12+i*4} min</small></div><button class="play" onclick="go('practice')">▶</button></div>`).join('')}</div><div class="panel"><h2>All skills</h2><p>Build balanced fluency</p>${[['Reading',78],['Listening',64],['Speaking',52],['Writing',70]].map(x=>`<div class="skill"><div><b>${x[0]}</b></div><div class="bar"><i style="width:${x[1]}%"></i></div><small>${x[1]}%</small></div>`).join('')}</div></div>`}
function practice(){let opts=q===0?['She has lived here for five years.','She live here since five years.','She living here for five years.']:['have','had','will have'];return `<section class="practice"><div class="practicehead"><div><div class="eyebrow">PRACTICE LAB · ${lang.toUpperCase()}</div><h1>Today's challenge</h1><p class="lead">Listening + vocabulary + grammar em uma sessão focada.</p></div><div class="timer">08:42</div></div><div class="practicegrid"><div class="exercise"><div class="eyebrow">QUESTION ${q+1} OF 2 · B1 GRAMMAR</div><h2>${q===0?'Choose the correct sentence:':'Complete: If I ___ more time, I would travel more.'}</h2>${q===0?'<div class="audio">🔊 &nbsp; Listen & repeat · Natural speed · 0:18</div>':''}<div class="options">${opts.map((o,i)=>`<button onclick="answer(${i})"><b>${String.fromCharCode(65+i)}</b> &nbsp; ${o}</button>`).join('')}</div><div class="hint">💡 <b>Hint:</b> Think about the time expression and the verb tense.</div></div><div><div class="video">▶<small>Mini lesson</small><b>Grammar in context</b></div><div class="xp">🔥 <b>1,240 XP</b><br><small>Your total XP</small></div></div></div></section>`}
function skills(){return `<section class="page"><div class="eyebrow">SKILLS LAB</div><h1>Train every skill</h1><p class="lead">Transforme conhecimento em uso real.</p><div class="cards">${['Reading','Listening','Speaking','Writing'].map(x=>`<div class="card"><div style="font-size:25px">${x==='Reading'?'📖':x==='Listening'?'🎧':x==='Speaking'?'🎙️':'✍️'}</div><h2>${x}</h2><p>Atividades graduadas por nível, feedback imediato e desafios reais para desenvolver ${x.toLowerCase()}.</p><button class="primary">Start practice →</button></div>`).join('')}</div></section>`}
function library(){return `<section class="page"><div class="eyebrow">MEDIA LIBRARY</div><h1>Learn with real content</h1><p class="lead">Vídeos, textos, áudios e materiais organizados por nível.</p><div class="media"><div class="mediaitem"><div class="thumb">▶</div><b>English conversations in real life</b><small>Video · B1 · Listening</small></div><div class="mediaitem"><div class="thumb" style="background:linear-gradient(135deg,#1f2937,#64748b)">▣</div><b>News reading lab</b><small>Article · B2 · Reading</small></div><div class="mediaitem"><div class="thumb" style="background:linear-gradient(135deg,#7f1d1d,#ef4444)">🎧</div><b>Spanish daily dialogue</b><small>Audio · A2 · Listening</small></div></div></section>`}
function progress(){return `<section class="page"><div class="eyebrow">YOUR PROGRESS</div><h1>Fluency dashboard</h1><p class="lead">Acompanhe evolução e domínio por habilidade.</p><div class="panel" style="margin-top:28px"><span class="eyebrow">OVERALL CEFR</span><h1 style="font-size:50px">B1</h1><p>68% toward B2</p></div><div class="panel" style="margin-top:15px">${[['Reading',78],['Listening',64],['Speaking',52],['Writing',70],['Vocabulary',74],['Grammar',66]].map(x=>`<div style="margin:15px 0"><div class="skill"><b>${x[0]}</b><span>${x[1]}%</span></div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></section>`}
function render(){document.getElementById('crumbLevel').textContent=level;document.getElementById('app').innerHTML=page==='dashboard'?dashboard():page==='practice'?practice():page==='skills'?skills():page==='library'?library():progress();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('sel',b.dataset.page===page))}function go(p){page=p;render()}function setLevel(x){level=x;render()}function answer(i){if((q===0&&i===0)||(q===1&&i===1)){if(q===0){q=1;render()}else{alert('Excellent! +20 XP');q=0;go('progress')}}else alert('Try again — use the hint!')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('en').onclick=()=>{lang='English';document.getElementById('en').className='on';document.getElementById('es').className='';render()};document.getElementById('es').onclick=()=>{lang='Español';document.getElementById('es').className='on';document.getElementById('en').className='';render()};render();
</script></body></html>
