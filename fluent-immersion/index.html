t:6px;background:#f0f0f0;border-radius:5px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--g)}.excard{border:1px solid var(--line);border-radius:15px;padding:19px}.question{font-size:16px;line-height:1.5;margin-bottom:14px}.options{display:grid;gap:8px}.option{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;text-align:left;font-size:13px}.option.correct{border-color:var(--g);background:var(--mint)}.option.wrong{border-color:#e58b8b;background:#fff3f3}.feedback{margin-top:12px;padding:10px;border-radius:9px;font-size:13px}.good{background:var(--mint);color:var(--gd)}.bad{background:#fff3f3;color:#a33}@media(max-width:850px){.hero-in{align-items:flex-start;flex-direction:column}.levels{grid-template-columns:repeat(4,1fr)}.lessons{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.hero{padding:27px 16px 43px}.container{padding:24px 16px 45px}.brand h1{font-size:31px}.brand p{font-size:13px;line-height:1.4}.hero-copy>p{font-size:13px}.langs{grid-template-columns:1fr 1fr}.levels{grid-template-columns:repeat(3,1fr)}.skills{grid-template-columns:1fr 1fr}.lessons{grid-template-columns:1fr}.lesson-main{padding:22px 15px 50px}.lesson-main>h1{font-size:27px}.content{padding:19px}.content p{font-size:15px}.tags{display:none}}
</style></head><body><div id="root"></div><script>
const db=supabase.createClient('https://rvgcniaowzmsudzliozf.supabase.co','sb_publishable_N_xCS0lbbTvG7qWTpAw0ag_vlg1lbHb',{db:{schema:'fluent_immersion'}}),L=['A0','A1','A2','B1','B2','C1','C2'],N={A0:'Absolute Beginner',A1:'Beginner',A2:'Elementary',B1:'Intermediate',B2:'Upper-Intermediate',C1:'Advanced',C2:'Proficient'},K=[['listening','🎧','Listening'],['reading','📖','Reading'],['speaking','🎙️','Speaking'],['writing','✍️','Writing']],F={en:'🇬🇧',es:'🇪🇸'};
let S={lang:localStorage.fiLang||'en',level:localStorage.fiLevel||'A1',skill:localStorage.fiSkill||'reading',lessons:[],progress:[],user:null,profile:null,lesson:null,items:[],i:0,score:0},$=x=>document.getElementById(x),E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.fiLang=S.lang;localStorage.fiLevel=S.level;localStorage.fiSkill=S.skill}
async function boot(){let u=await db.auth.getUser();S.user=u.data.user||null;if(S.user){let p=await db.from('user_profiles').select('*').eq('user_id',S.user.id).maybeSingle();if(!p.data)p=await db.from('user_profiles').upsert({user_id:S.user.id,display_name:S.user.email?.split('@')[0]||'Aluno',current_language:S.lang,current_level:S.level,xp:0,streak_days:0},{onConflict:'user_id'}).select().single();S.profile=p.data;S.lang=S.profile?.current_language||S.lang;S.level=S.profile?.current_level||S.level;save()}await refresh()}
async function refresh(){S.lessons=[];let a=await db.from('languages').select('id').eq('code',S.lang).maybeSingle(),b=await db.from('cefr_levels').select('id').eq('code',S.level).maybeSingle();if(a.data&&b.data){let c=await db.from('courses').select('id').eq('language_id',a.data.id).eq('level_id',b.data.id).maybeSingle();if(c.data){let u=await db.from('units').select('id').eq('course_id',c.data.id),ids=(u.data||[]).map(x=>x.id);if(ids.length){let q=await db.from('lessons').select('id,title,description,duration_minutes,skill').in('unit_id',ids).eq('published',true).eq('skill',S.skill).order('position');S.lessons=q.data||[]}}}if(S.user){let p=await db.from('progress').select('lesson_id,completion_percent,score_percent').eq('user_id',S.user.id);S.progress=p.data||[]}home()}

function home(){$('root').innerHTML='<header class="hero"><div class="hero-in"><div class="hero-copy"><div class="brand"><div class="mark">🎓</div><div><h1>FLUENT IMMERSION</h1><p>Aprenda Inglês &amp; Espanhol — A0 ao C2 · Reading · Writing · Speaking · Listening</p></div></div><p>Trilha didática completa e interativa: vídeos reais, áudios, textos, exercícios com correção automática e prática de fala com o microfone do navegador.</p></div>'+stats()+'</div></header><main class="container"><section class="step"><h2 class="st"><span class="ico">🌐</span> 1. Escolha o idioma</h2><div class="langs">'+['en','es'].map(l=>'<button class="choice '+(S.lang===l?'active':'')+'" onclick="choose(\'lang\',\''+l+'\')"><span class="flag">'+F[l]+'</span><strong>'+(l==='en'?'English':'Español')+'</strong><small>'+(l==='en'?'Inglês':'Espanhol')+'</small>'+(S.lang===l?'<span class="check">✓</span>':'')+'</button>').join('')+'</div></section><section class="step"><h2 class="st"><span class="ico">🎓</span> 2. Escolha o nível (CEFR)</h2><div class="levels">'+L.map(l=>'<button class="level '+(S.level===l?'active':'')+'" onclick="choose(\'level\',\''+l+'\')">'+l+'</button>').join('')+'</div><p class="desc">'+S.level+' — '+N[S.level]+'</p></section><section class="step"><h2 class="st"><span class="ico">📖</span> 3. Escolha a habilidade</h2><div class="skills">'+K.map(s=>'<button class="skill '+(S.skill===s[0]?'active':'')+'" onclick="choose(\'skill\',\''+s[0]+'\')"><span>'+s[1]+'</span>'+s[2]+'</button>').join('')+'</div></section><div class="head"><h2>4. Lições disponíveis</h2><span class="count">'+S.lessons.length+' '+(S.lessons.length===1?'lição':'lições')+'</span></div><section class="lessons">'+(S.lessons.length?S.lessons.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Nenhuma lição publicada para esta combinação ainda.</div>')+'</section><div class="head"><h2>🏆 Seu progresso</h2></div><section class="progress">'+rows()+'</section></main><footer class="footer">FLUENT IMMERSION · 2026 · Aprenda inglês e espanhol de forma interativa</footer><div id="modal"></div>'}
function card(l){let p=S.progress.find(x=>x.lesson_id===l.id),d=p?.completion_percent>=100;return '<article class="lesson"><div class="lt"><h3>'+E(l.title)+'</h3><span class="done">'+(d?'✓':'')+'</span></div><p>'+E(l.description||'Pratique esta habilidade com uma atividade guiada e exercícios interativos.')+'</p><div class="meta"><span class="pill">◷ '+(l.duration_minutes||15)+' min</span><span class="pill xp">☆ 10 XP</span></div><button onclick="openLesson(\''+l.id+'\')">'+(d?'Revisar lição':'Começar lição')+'</button></article>'}
function rows(){if(!S.progress.length)return '<div class="empty" style="border:0">Faça uma lição para começar a registrar seu progresso.</div>';return S.progress.slice(0,8).map(p=>'<div class="prow"><span class="dot '+(p.completion_percent>=100?'ok':'')+'">'+(p.completion_percent>=100?'✓':'')+'</span><span class="pname">'+E((S.lessons.find(l=>l.id===p.lesson_id)||{}).title||'Lição')+'</span><span class="score">'+Math.round(p.completion_percent||0)+'%</span><span class="pxp">☆ '+(p.completion_percent>=100?10:0)+'</span></div>').join('')}
async function openLesson(id){$('root').innerHTML='<div class="empty" style="margin:40px">Carregando lição...</div>';let l=await db.from('lessons').select('id,title,description,duration_minutes,skill').eq('id',id).single(),c=await db.from('content').select('*').eq('lesson_id',id).order('position'),e=await db.from('exercises').select('id,title,instructions,exercise_type,xp').eq('lesson_id',id).eq('published',true).order('position');let items=[];for(let x of(e.data||[])){let r=await db.from('exercise_items').select('*').eq('exercise_id',x.id).order('position');items.push(...(r.data||[]).map(i=>({...i,exercise:x})))}S.lesson={...l.data,content:c.data||[]};S.items=items;S.i=0;S.score=0;renderLesson()}
function contents(){let c=S.lesson.content||[];if(!c.length)return '<div class="content"><h2>📖 Conteúdo</h2><p>Esta lição está pronta para receber o conteúdo didático.</p></div>';return c.map(x=>x.type==='video'&&x.media_url?'<div class="content"><h2>🎬 '+E(x.title||'Vídeo')+'</h2><iframe src="'+E(x.media_url)+'" allowfullscreen></iframe></div>':x.type==='audio'&&x.media_url?'<div class="content"><h2>🎧 '+E(x.title||'Áudio')+'</h2><audio controls src="'+E(x.media_url)+'" style="width:100%"></audio></div>':'<div class="content"><h2>📖 '+E(x.title||'Conteúdo')+'</h2>'+String(x.body||'').split(/\n\s*\n/).map(p=>'<p>'+E(p)+'</p>').join('')+'</div>').join('')}
function renderLesson(){let l=S.lesson,t=S.items.length,it=S.items[S.i];$('root').innerHTML='<div class="lesson-view"><nav class="nav"><button class="back" onclick="refresh()">← Voltar</button><div class="tags"><span class="tag">'+F[S.lang]+' '+(S.lang==='en'?'English':'Español')+'</span><span class="tag">'+S.level+'</span><span class="tag">'+E(l.skill)+'</span></div></nav><main class="lesson-main"><h1>'+E(l.title)+'</h1><p class="sub">'+E(l.description||'Prática guiada para desenvolver sua habilidade.')+'</p><div class="lmeta">◷ '+(l.duration_minutes||15)+' min · ☆ '+(t*10||10)+' XP · '+t+' exercícios</div>'+contents()+(t?'<section><div class="exhead"><h2>✍️ Exercícios</h2><span>Exercício '+(S.i+1)+' / '+t+'</span></div><div class="bar"><i style="width:'+(S.i/t*100)+'%"></i></div>'+ex(it)+'</section>':'<div class="empty">Esta lição ainda não possui exercícios publicados.</div>')+'</main></div>'}

function ex(it){let o=Array.isArray(it.options)?it.options:[],a=ans(it.answer),c=a?.index??a?.correct??a;return '<div class="excard"><div class="question">'+E(it.prompt)+'</div><div class="options">'+o.map((x,i)=>'<button class="option" onclick="check('+i+','+JSON.stringify(String(c))+')">'+String.fromCharCode(65+i)+'. '+E(x)+'</button>').join('')+'</div><div id="feedback"></div></div>'}
async function check(i,c){let it=S.items[S.i],ok=String(i)===String(c);document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===i)b.classList.add(ok?'correct':'wrong');if(String(n)===String(c))b.classList.add('correct')});let f=$('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'Correto! Você ganhou XP.':(it.explanation||'Revise o conteúdo e tente novamente.');if(ok)S.score++;let b=document.createElement('button');b.className='finish';b.textContent=S.i<S.items.length-1?'Próximo exercício →':'Concluir lição ✓';b.onclick=S.i<S.items.length-1?()=>{S.i++;renderLesson()}:finish;f.appendChild(b)}
async function finish(){let t=S.items.length||1,sc=Math.round(S.score/t*100);if(S.user){await db.from('progress').upsert({user_id:S.user.id,lesson_id:S.lesson.id,completion_percent:100,score_percent:sc,completed_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id,lesson_id'});let g=S.items.length*10,o=S.profile?.xp||0;await db.from('user_profiles').update({xp:o+g}).eq('user_id',S.user.id);S.profile.xp=o+g}alert('Lição concluída! '+sc+'% · +'+S.items.length*10+' XP');refresh()}
function auth(){$('modal').innerHTML='<div class="modal"><div class="card"><button class="close" onclick="closeAuth()">×</button><h2>Entrar na plataforma</h2><p>Salve seu progresso, XP e lições concluídas.</p><form class="form" onsubmit="login(event)"><input id="email" class="field" type="email" placeholder="Seu e-mail" required><input id="pass" class="field" type="password" placeholder="Sua senha" required><button class="primary">Entrar</button><div id="msg" class="msg"></div></form><button onclick="signup()" style="margin-top:12px;background:none;color:var(--g);font-size:12px">Criar uma conta</button></div></div>'}
function closeAuth(){$('modal').innerHTML=''}async function login(e){e.preventDefault();let r=await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error){$('msg').textContent=r.error.message;return}let u=await db.auth.getUser();S.user=u.data.user;let p=await db.from('user_profiles').select('*').eq('user_id',S.user.id).maybeSingle();S.profile=p.data;closeAuth();refresh()}async function signup(){let email=prompt('Seu e-mail');if(!email)return;let password=prompt('Crie uma senha com pelo menos 6 caracteres');if(!password)return;let r=await db.auth.signUp({email,password,options:{data:{display_name:email.split('@')[0]}}});alert(r.error?r.error.message:'Conta criada. Confirme seu e-mail se solicitado.')}
