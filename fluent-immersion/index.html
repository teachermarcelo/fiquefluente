<script>
const SUPABASE_URL='https://rvgcniaowzmsudzliozf.supabase.co',SUPABASE_KEY='sb_publishable_N_xCS0lbbTvG7qWTpAw0ag_vlg1lbHb';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{db:{schema:'fluent_immersion'}});
let lang='en',level='A1',page='dashboard',authMode='login',profile=null,recording=false,recorder,chunks=[];
const levels=['A0','A1','A2','B1','B2','C1','C2'],fallbackLessons={A0:['Greetings & Introductions','Alphabet & Spelling','Numbers & Personal Info'],A1:['Daily Routines','At the Café','My Family'],A2:['Travel Experiences','Shopping & Prices','Past Events'],B1:['Work & Career','Technology & Society','Travel Stories'],B2:['News & Current Issues','Debates & Opinions','Academic Listening'],C1:['Advanced Arguments','Presentations','Formal Writing'],C2:['Nuance & Register','Advanced Listening Lab','Persuasive Writing']};
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(n='Fluent Immersion'){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function msg(id,t,type='error'){$(id).innerHTML='<div class="notice '+type+'">'+esc(t)+'</div>'}
async function loadProfile(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;let {data}=await sb.from('user_profiles').select('*').eq('user_id',user.id).maybeSingle();if(!data){const p={user_id:user.id,display_name:user.user_metadata?.display_name||user.email.split('@')[0],current_language:'en',current_level:'A1',xp:0,streak:0};const r=await sb.from('user_profiles').upsert(p).select().single();data=r.data||p}profile=data;lang=data.current_language||'en';level=data.current_level||'A1'}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){await loadProfile();enter()}else $('auth').classList.remove('hidden')}
function enter(){$('auth').classList.add('hidden');$('appShell').classList.remove('hidden');$('avatar').textContent=initials(profile.display_name);render()}
$('loginTab').onclick=()=>{authMode='login';$('loginTab').className='on';$('signupTab').className='';$('name').classList.add('hidden');$('authBtn').textContent='Entrar'};
$('signupTab').onclick=()=>{authMode='signup';$('signupTab').className='on';$('loginTab').className='';$('name').classList.remove('hidden');$('authBtn').textContent='Criar conta'};
$('authForm').onsubmit=async e=>{e.preventDefault();$('authBtn').disabled=true;const email=$('email').value,password=$('password').value;if(authMode==='login'){const r=await sb.auth.signInWithPassword({email,password});if(r.error)msg('authMsg',r.error.message);else{await loadProfile();enter()}}else{const r=await sb.auth.signUp({email,password,options:{data:{display_name:$('name').value||'Aluno'}}});if(r.error)msg('authMsg',r.error.message);else if(r.data.session){await loadProfile();enter()}else msg('authMsg','Conta criada. Verifique seu e-mail para confirmar.','ok')}$('authBtn').disabled=false};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
function setLanguage(x){lang=x;profile.current_language=x;sb.from('user_profiles').update({current_language:x}).eq('user_id',profile.user_id);$('en').className=x==='en'?'on':'';$('es').className=x==='es'?'on':'';render()}
function setLevel(x){level=x;profile.current_level=x;sb.from('user_profiles').update({current_level:x}).eq('user_id',profile.user_id);render()}
$('en').onclick=()=>setLanguage('en');$('es').onclick=()=>setLanguage('es');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
function nav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('sel',b.dataset.page===page))}
function levelPicker(){return '<div class="level"><div><span class="eyebrow">CURRENT LEVEL</span><br><strong>'+level+'</strong></div>'+levels.map(x=>'<button class="'+(x===level?'active':'')+'" onclick="setLevel(\''+x+'\')">'+x+'</button>').join('')+'<div class="cefr">CEFR<br>A0 → C2</div></div>'}
function stats(){return '<div class="stats"><div><b>🔥 '+(profile.streak_days||0)+'</b><span>day streak</span></div><div><b>'+Math.min(100,Math.round((profile.xp||0)/20))+'%</b><span>learning progress</span></div><div><b>'+(profile.xp||0)+'</b><span>XP total</span></div><div><b>✓</b><span>keep practicing</span></div></div>'}
function dashboard(){return '<section class="hero"><div><div class="eyebrow">YOUR LANGUAGE JOURNEY</div><h1>Learn. Practice.<br><em>Become fluent.</em></h1><p>Inglês e espanhol de A0 a C2 com reading, listening, speaking, writing, grammar e vocabulary.</p><div class="actions"><button class="primary" onclick="go(\'practice\')">Continue learning →</button><button class="ghost" onclick="go(\'courses\')">Explore courses</button></div></div><div class="art"><div class="orb"></div><div class="float f1">🎧 Listening</div><div class="float f2">🎙️ Speaking</div><div class="float f3">✍️ Writing</div><div class="float f4">📖 Reading</div></div></section>'+levelPicker()+stats()+'<div class="grid"><div class="panel"><div class="panelhead"><div><h2>Recommended for '+level+'</h2><p>Conteúdo base + exercícios interativos</p></div><button onclick="go(\'courses\')">View all →</button></div>'+fallbackLessons[level].map((x,i)=>'<div class="lesson"><div class="num">0'+(i+1)+'</div><div class="lessonmain"><b>'+x+'</b><small><span class="tag">'+['Reading','Speaking','Listening'][i]+'</span> · '+(12+i*4)+' min</small></div><button class="play" onclick="go(\'practice\')">▶</button></div>').join('')+'</div><div class="panel"><h2>All skills</h2><p>Build balanced fluency</p>'+[['Reading',78],['Listening',64],['Speaking',52],['Writing',70]].map(x=>'<div class="skill"><b>'+x[0]+'</b><div class="bar"><i style="width:'+x[1]+'%"></i></div><small>'+x[1]+'%</small></div>').join('')+'</div></div><div class="grid"><div class="panel"><h2>AI-powered learning</h2><p>Geração de prática e feedback preparado para Gemini.</p><div class="actions"><button class="primary" onclick="go(\'writing\')">Try AI Writing</button><button class="ghost" onclick="go(\'speaking\')">Try Speaking</button></div></div><div class="panel"><h2>Free AI test</h2><p>Sem chave paga, o Writing usa avaliação local. Quando Gemini for configurado no backend, a avaliação passa para IA.</p></div></div>'}
async function courses(){return '<section class="page"><div class="eyebrow">'+(lang==='en'?'ENGLISH':'ESPAÑOL')+' · CEFR</div><h1>Courses A0 → C2</h1><p class="lead">Escolha um nível para estudar.</p><div class="cards">'+levels.map(l=>'<div class="card"><div class="eyebrow">'+l+'</div><h2>'+l+' '+(lang==='en'?'English':'Spanish')+'</h2><p>Reading · Listening · Speaking · Writing · Grammar · Vocabulary</p><button class="primary" onclick="setLevel(\''+l+'\');go(\'practice\')">Study this level →</button></div>').join('')+'</div></section>'}
async function practice(){let r=await sb.from('exercises').select('*,lessons!inner(title,skill,level)').eq('published',true).limit(30);let ex=r.data?.find(x=>x.lessons?.units?.courses?.cefr_levels?.code===level && x.lessons?.units?.courses?.languages?.code===lang);if(!ex)return '<section class="page"><div class="eyebrow">PRACTICE LAB</div><h1>Practice '+level+'</h1><p class="lead">Ainda não há exercícios publicados neste nível.</p><div class="panel" style="margin-top:25px"><h2>Comece pelo AI Writing</h2><p>O banco está pronto para receber exercícios por nível, idioma e habilidade.</p><button class="primary" onclick="go(\'writing\')">Test Writing →</button></div></section>';let ir=await sb.from('exercise_items').select('*').eq('exercise_id',ex.id).order('position');let it=ir.data?.[0];if(!it)return '<section class="page"><h1>Exercise</h1><p>Exercise without items.</p></section>';let opts=Array.isArray(it.options)?it.options:[];return '<section class="page"><div class="eyebrow">PRACTICE LAB · '+esc(ex.exercise_type)+'</div><h1>'+esc(ex.lessons?.title||'Practice')+'</h1><div class="practicegrid"><div class="exercise"><div class="eyebrow">QUESTION</div><h2>'+esc(it.prompt)+'</h2><div class="options">'+opts.map((o,i)=>'<button onclick="answer(\''+ex.id+'\','+i+',\''+String(it.answer?.correct ?? it.answer||'').replaceAll("'","\\'")+'\')"><b>'+String.fromCharCode(65+i)+'</b> &nbsp; '+esc(o)+'</button>').join('')+'</div><div id="feedback"></div></div><div class="panel"><h2>⭐ XP</h2><p>Acertos entram no seu histórico.</p></div></div></section>'}
async function answer(exId,i,correct){let ok=String(i)===String(correct);$('feedback').innerHTML='<div class="notice '+(ok?'ok':'error')+'">'+(ok?'Excellent! +20 XP':'Not quite. Try again.')+'</div>';if(ok){profile.xp=(profile.xp||0)+20;const {data:{user}}=await sb.auth.getUser();await sb.from('attempts').insert({user_id:user.id,exercise_id:exId,score_percent:100,correct_count:1,total_count:1,answers:{selected:i},xp_earned:20});await sb.from('user_profiles').update({xp:profile.xp}).eq('id',user.id)}}
function writing(){return '<section class="page"><div class="eyebrow">AI WRITING LAB</div><h1>Write & get feedback</h1><p class="lead">Escreva uma resposta adequada ao nível '+level+'.</p><div class="panel"><h2>Prompt</h2><p>Write 120–150 words about a memorable trip, experience or future plan.</p><form id="writingForm" class="form"><textarea id="writingText" placeholder="Start writing here..." required></textarea><button class="primary">Evaluate my writing →</button></form><div id="writingResult"></div></div></section>'}
function localEval(t){let w=t.split(/\s+/).filter(Boolean).length,s=Math.round(Math.min(100,Math.max(35,45+Math.min(w,120)*.35+(/[.!?]/.test(t)?8:0)+(t.length>250?10:0))));return{score:s,grammar:Math.min(100,s+2),vocab:Math.max(0,s-3),coherence:s,feedback:w<80?'Develop your ideas with more details, examples and connectors.':'Good start. Add more precise vocabulary and review verb tenses for a stronger answer.'}}
async function evaluateWriting(e){e.preventDefault();let t=$('writingText').value.trim(),r=localEval(t);$('writingResult').innerHTML='<div class="notice ok"><b>Score: '+r.score+'/100</b><br>Grammar: '+r.grammar+' · Vocabulary: '+r.vocab+' · Coherence: '+r.coherence+'<br><br>'+esc(r.feedback)+'</div>';profile.xp=(profile.xp||0)+10;await sb.from('user_profiles').update({xp:profile.xp}).eq('user_id',profile.user_id)}
function speaking(){return '<section class="page"><div class="eyebrow">SPEAKING LAB</div><h1>Speak naturally</h1><p class="lead">Grave sua resposta. A próxima camada pode transcrever e avaliar com IA.</p><div class="panel"><h2>Prompt · '+level+'</h2><p>Tell us about your daily routine, your work or something you enjoy doing.</p><button class="primary" id="recordBtn" onclick="toggleRecord()">🎙 Start recording</button><span id="recordState" style="margin-left:10px;color:#888"></span><audio id="audio" controls class="hidden" style="display:block;margin-top:15px;width:100%"></audio><div id="speechResult"></div></div></section>'}
async function toggleRecord(){if(!recording){let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let b=new Blob(chunks,{type:'audio/webm'});$('audio').src=URL.createObjectURL(b);$('audio').classList.remove('hidden');$('speechResult').innerHTML='<div class="notice ok">Gravação concluída. A avaliação automática por transcrição será ligada ao backend de IA.</div>';profile.xp=(profile.xp||0)+10;sb.from('user_profiles').update({xp:profile.xp}).eq('user_id',profile.user_id);stream.getTracks().forEach(t=>t.stop())};recorder.start();recording=true;$('recordBtn').textContent='⏹ Stop recording';$('recordState').textContent='Recording...'}else{recorder.stop();recording=false;$('recordBtn').textContent='🎙 Start recording';$('recordState').textContent=''}}
function library(){return '<section class="page"><div class="eyebrow">MEDIA LIBRARY</div><h1>Learn with real content</h1><p class="lead">Vídeos, textos e áudios organizados por nível.</p><div class="media"><div class="mediaitem"><div class="thumb">▶</div><b>YouTube listening lab</b><small>Vídeos incorporados · '+level+'</small></div><div class="mediaitem"><div class="thumb">▣</div><b>Reading lab</b><small>Textos autênticos · '+level+'</small></div><div class="mediaitem"><div class="thumb">🎧</div><b>Audio lab</b><small>TTS e listening · '+level+'</small></div></div></section>'}
async function progress(){let r=await sb.from('attempts').select('score_percent,xp_earned,created_at').order('created_at',{ascending:false}).limit(20);return '<section class="page"><div class="eyebrow">YOUR PROGRESS</div><h1>Fluency dashboard</h1><p class="lead">Seu histórico de prática.</p><div class="stats"><div><b>'+(profile.xp||0)+'</b><span>XP total</span></div><div><b>'+((r.data||[]).length)+'</b><span>attempts</span></div><div><b>'+level+'</b><span>current CEFR</span></div><div><b>'+(lang==='en'?'English':'Spanish')+'</b><span>language</span></div></div><div class="panel" style="margin-top:18px"><h2>Skill progress</h2>'+[['Reading',78],['Listening',64],['Speaking',52],['Writing',70],['Vocabulary',74],['Grammar',66]].map(x=>'<div style="margin:15px 0"><div class="skill"><b>'+x[0]+'</b><div class="bar"><i style="width:'+x[1]+'%"></i></div><small>'+x[1]+'%</small></div></div>').join('')+'</div></section>'}
function skills(){return '<section class="page"><div class="eyebrow">SKILLS LAB</div><h1>Train every skill</h1><p class="lead">Reading, listening, speaking e writing com prática graduada.</p><div class="cards">'+[['📖','Reading','Compreenda textos por nível.'],['🎧','Listening','Treine compreensão com áudio.'],['🎙️','Speaking','Grave e pratique respostas.'],['✍️','Writing','Escreva e receba feedback.']].map(x=>'<div class="card"><div style="font-size:25px">'+x[0]+'</div><h2>'+x[1]+'</h2><p>'+x[2]+'</p><button class="primary" onclick="go(\''+x[1].toLowerCase()+'\')">Start →</button></div>').join('')+'</div></section>'}
function go(p){page=p;render()}
async function render(){nav();$('crumbLevel').textContent=level;let out=page==='dashboard'?dashboard():page==='courses'?await courses():page==='practice'?await practice():page==='skills'?skills():page==='library'?library():page==='progress'?await progress():page==='writing'?writing():speaking();$('app').innerHTML=out;if(page==='writing')$('writingForm').onsubmit=evaluateWriting}
boot();
</script></body></html>
